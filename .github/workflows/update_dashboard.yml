name: Atualização Diária D-1 Dashboard SNOC

on:
  schedule:
    # Executa automaticamente todos os dias às 02:00 BRT (05:00 UTC)
    - cron: '0 5 * * *'
  # Permite que o botão "Atualizar" do painel acione a esteira manualmente:
  workflow_dispatch:
    push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'template/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Executar Extração D-1 e Gerar HTML
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          python scripts/generate_dashboard.py

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload do Artefato HTML
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
